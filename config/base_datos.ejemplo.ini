; Plantilla de configuracion de la lectura directa de la base de datos.
;
; 1. Copie este archivo como config/base_datos.ini (ese nombre lo ignora git:
;    la clave nunca se sube al repositorio).
; 2. Reemplace los valores de ejemplo.
;
; Las variables de entorno FIREBIRD_DB, FIREBIRD_HOST, FIREBIRD_USER,
; FIREBIRD_PASSWORD, FIREBIRD_CLIENT y FIREBIRD_MESES, si existen, tienen
; prioridad sobre este archivo.
;
; El sistema solo LEE la base (transaccion de solo lectura, solo consultas
; SELECT): nunca escribe ni modifica datos.

[firebird]
; Ruta del archivo .fdb de la base de ventas. Con "host" vacio es una ruta de
; este equipo; con "host" es la ruta de la base EN EL SERVIDOR.
base_datos = C:\RUTA\A\LA\BASE\DEL_TALLER.FDB

; Vacio: se abre el archivo en este equipo. Con servidor Firebird: el nombre o
; la IP del equipo servidor (por ejemplo: localhost o 192.168.1.10).
host =

; Usuario y clave de Firebird con permiso de lectura.
usuario = SYSDBA
clave = ESCRIBA_AQUI_LA_CLAVE

; Ruta del cliente de Firebird (fbclient.dll) de una instalacion de Firebird
; de este equipo, por ejemplo C:\Program Files\Firebird\Firebird_5_0\fbclient.dll
cliente = C:\RUTA\A\FIREBIRD\fbclient.dll

; Meses completos que se leen para entrenar (por defecto 24).
meses = 24
